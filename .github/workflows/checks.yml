name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run prepare:vision
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python tools/prepare.py
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        working-directory: android
      - run: python tools/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: iris-control-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run prepare:vision
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run install:runtime
        working-directory: desktop
      - run: npm run build:native
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run package
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: iris-control-windows-portable
          path: desktop/release/package/IrisControl-*-win32-x64/
